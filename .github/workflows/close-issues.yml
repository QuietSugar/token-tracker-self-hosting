name: close-issues
on:
  push:
    branches: [arena/05cbbe3c-token-tracker-self-hosting]
permissions:
  issues: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comment on 47
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue comment 47 --repo "$REPO" --body-file .github/issue-47-closing.md
