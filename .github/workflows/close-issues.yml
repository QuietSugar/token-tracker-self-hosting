name: close-issues
on:
  push:
    branches: [arena/05cbbe3c-token-tracker-self-hosting]
permissions:
  issues: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close 44 and 47
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue close 44 --repo "$REPO" --reason completed --comment "$(cat .github/issue-44-closing.md)"
          gh issue close 47 --repo "$REPO" --reason completed --comment "$(cat .github/issue-47-closing.md)"
