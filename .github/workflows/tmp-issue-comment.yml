name: tmp-issue-comment

# 一次性任务：把 .arena-tmp/issue-44-reply.md 发到 issue #44。发完即删。

on:
  push:
    branches: ['arena/6f8b2c27-token-tracker-self-hosting']
    paths:
      - '.arena-tmp/issue-44-reply.md'
      - '.github/workflows/tmp-issue-comment.yml'

permissions:
  contents: read
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post comment to issue #44
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wc -l .arena-tmp/issue-44-reply.md
          gh issue comment 44 --repo "${{ github.repository }}" --body-file .arena-tmp/issue-44-reply.md
          echo "✓ 已发布"
