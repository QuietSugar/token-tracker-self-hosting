name: tmp-issue-comment

# 一次性任务：把 .arena-tmp/issue-38-reply.md 发到 issue #38。
# Arena 的 GitHub App 只有 issues:read，沙箱里的 gh 无法评论 issue；
# Actions 的 GITHUB_TOKEN 归本仓库自己的 workflow permissions 管，显式声明 issues:write 即可。发完即删。

on:
  push:
    branches: ['arena/5327194b-token-tracker-self-hosting']
    paths:
      - '.arena-tmp/issue-38-reply.md'
      - '.github/workflows/tmp-issue-comment.yml'

permissions:
  contents: read
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post comment to issue #38
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wc -l .arena-tmp/issue-38-reply.md
          gh issue comment 38 --repo "${{ github.repository }}" --body-file .arena-tmp/issue-38-reply.md
          echo "✓ 已发布"
