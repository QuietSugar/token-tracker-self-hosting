name: tmp-issue-comment

# 一次性任务：把 .arena-tmp/issue-35-reply.md 发到 issue #35。
#
# 为什么需要它：Arena 的 GitHub App 只申请了 `issues: read`，沙箱里的 gh 无法评论 issue；
# 而 Actions 每次运行拿到的 GITHUB_TOKEN 归本仓库自己的 Workflow permissions 管，
# 显式声明 `issues: write` 就能发。发完即删（本文件与正文文件都会被移除）。

on:
  push:
    branches: ['arena/dc7c180a-token-tracker-self-hosting']
    paths:
      - '.arena-tmp/issue-35-reply.md'
      - '.github/workflows/tmp-issue-comment.yml'

permissions:
  contents: read
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show effective token permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -i /repos/${{ github.repository }} 2>/dev/null | grep -i '^x-accepted-github-permissions' || true

      - name: Post comment to issue #35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wc -l .arena-tmp/issue-35-reply.md
          gh issue comment 35 --repo "${{ github.repository }}" --body-file .arena-tmp/issue-35-reply.md
          echo "✓ 已发布"
