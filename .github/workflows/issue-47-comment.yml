name: issue-47-comment
on:
  push:
    branches: [arena/2bac6b9e-token-tracker-self-hosting]
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post comment to issue 47
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 47 --repo "$GITHUB_REPOSITORY" --body-file .github/issue-47-comment.md
