# 实验用 Go + SQLite 自托管后端（零依赖单文件）。
#
# 用法:
#   export TT_JWT_SECRET="$(openssl rand -hex 32)"   # 至少 32 字节，必须保密
#   docker compose -f docker-compose.sqlite-go.example.yml up -d
#   curl http://127.0.0.1:8080/health
#
# 备份：停服务后直接复制 /data 下的 tokentracker.db（+ -wal/-shm），
#       或使用 go-server/scripts/backup.sh sqlite。
# 升级：docker compose pull && docker compose up -d（schema 安装是幂等的）
#
# ⚠️ 当前只覆盖 STATUS.md 中明确列出的行为；不是 InsForge 替代品/生产 GA。
services:
  tokentracker-go:
    image: ghcr.io/quietsugar/token-tracker-self-hosting-go:experimental
    # 想本地构建镜像时取消下面 4 行注释（可去掉 image 行）
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TT_DATABASE_PATH: /data/tokentracker.db
      TT_LISTEN_ADDR: 0.0.0.0:8080
      TT_JWT_SECRET: ${TT_JWT_SECRET:?set a strong random secret}
      # 留空（默认）= 服务端按请求的 Host + X-Forwarded-Proto 推导设备授权页地址。
      # 官方客户端要求 verification_uri 与 base_url 同源；写死一个占位域名会让
      # device-login 报 "Device authorization returned a different dashboard"。
      TT_DASHBOARD_URL: "${TT_DASHBOARD_URL:-}"
      TT_NOW: ${TT_NOW:-}
    ports:
      - "127.0.0.1:${TT_PORT:-8080}:8080"
    volumes:
      - tokentracker-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  tokentracker-data:
