# 实验用 Go + PostgreSQL 自托管后端（推荐形态）。
#
# 用法:
#   export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
#   export TT_JWT_SECRET="$(openssl rand -hex 32)"   # 至少 32 字节，必须保密
#   docker compose -f docker-compose.postgres-go.example.yml up -d
#   curl http://127.0.0.1:8080/health
#
# 备份：go-server/scripts/backup.sh postgres（内部用 pg_dump）
# 升级：docker compose pull tokentracker-go && docker compose up -d tokentracker-go
#       （schema 安装幂等；PG 连接池会在重启时重建）
#
# ⚠️ 能力与已知缺口见 docs/status.md；不是生产 GA。
# ⚠️ 这里的 postgres:15-alpine 为了示例可读性用 tag；生产请按 OCI digest 固定，
#    并自行负责 pg_dump/物理备份、PITR、监控与升级窗口。
services:
  tokentracker-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokentracker
      POSTGRES_DB: tokentracker
      # 只用于本地示例；生产请换成 secrets 或外部托管 PG
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong random password}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - tokentracker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokentracker -d tokentracker"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    # 不发布到宿主机；Go 服务用 compose 内部网络访问。
    # 需要 psql/备份时临时加 ports 或 `docker compose exec tokentracker-postgres psql ...`。

  tokentracker-go:
    image: ghcr.io/quietsugar/token-tracker-self-hosting-go:experimental
    # 想本地构建镜像时取消下面 4 行注释（可去掉 image 行）
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      tokentracker-postgres:
        condition: service_healthy
    environment:
      # 只支持 PostgreSQL：这里的 DSN 就是唯一的数据源配置。
      TT_DATABASE_URL: postgres://tokentracker:${POSTGRES_PASSWORD}@tokentracker-postgres:5432/tokentracker?sslmode=disable
      TT_LISTEN_ADDR: 0.0.0.0:8080
      TT_JWT_SECRET: ${TT_JWT_SECRET:?set a strong random secret}
      # 留空（默认）= 服务端按请求的 Host + X-Forwarded-Proto 推导设备授权页地址。
      # 官方客户端要求 verification_uri 与 base_url 同源；写死一个占位域名会让
      # device-login 报 "Device authorization returned a different dashboard"。
      TT_DASHBOARD_URL: "${TT_DASHBOARD_URL:-}"
      TT_NOW: ${TT_NOW:-}
    ports:
      - "127.0.0.1:${TT_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  tokentracker-pgdata:
